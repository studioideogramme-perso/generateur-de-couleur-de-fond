<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2f6fdb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Couleur aléatoire</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      background-color: hsl(215 70% 55%);
      transition: background-color 1.2s cubic-bezier(.22, 1, .36, 1);
    }

    .hint {
      margin: 0;
      padding: 0.85rem 1.25rem;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(0, 0, 0, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(10px);
      font-size: clamp(0.9rem, 2vw, 1.05rem);
      letter-spacing: 0.02em;
      transition: transform 180ms ease, opacity 500ms ease;
      pointer-events: none;
    }

    body:active .hint {
      transform: scale(0.96);
    }

    body.clicked .hint {
      opacity: 0.72;
    }

    body.adjusting {
      transition-duration: 180ms;
    }

    .settings {
      position: fixed;
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(1rem, env(safe-area-inset-bottom));
      width: min(19rem, calc(100vw - 2rem));
      padding: 1rem 1.1rem 1.1rem;
      color: #fff;
      background: rgba(8, 8, 10, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1rem;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(14px);
      cursor: default;
    }

    .settings__title {
      margin: 0 0 0.9rem;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .control + .control {
      margin-top: 0.9rem;
    }

    .control__label {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.45rem;
      color: rgba(255, 255, 255, 0.82);
      font-size: 0.82rem;
    }

    .control__value {
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      display: block;
      width: 100%;
      height: 0.45rem;
      margin: 0;
      border-radius: 999px;
      appearance: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 1.15rem;
      height: 1.15rem;
      border: 2px solid rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      appearance: none;
    }

    #hue {
      background: linear-gradient(90deg, #f33, #ff0, #3f3, #0ff, #33f, #f0f, #f33);
    }

    #saturation {
      background: linear-gradient(90deg, #888, var(--saturation-color, #2f6fdb));
    }

    @media (prefers-reduced-motion: reduce) {
      body {
        transition-duration: 0.25s;
      }
    }
  </style>
</head>
<body aria-label="Cliquez pour changer la couleur de fond">
  <p class="hint">Cliquez n’importe où</p>

  <aside class="settings" aria-label="Personnaliser la couleur">
    <h2 class="settings__title">Personnaliser</h2>
    <div class="control">
      <label class="control__label" for="hue">
        <span>Teinte</span>
        <output class="control__value" id="hue-value" for="hue">215°</output>
      </label>
      <input id="hue" type="range" min="0" max="360" value="215">
    </div>
    <div class="control">
      <label class="control__label" for="saturation">
        <span>Saturation</span>
        <output class="control__value" id="saturation-value" for="saturation">70%</output>
      </label>
      <input id="saturation" type="range" min="0" max="100" value="70">
    </div>
  </aside>

  <script>
    const page = document.body;
    const settings = document.querySelector('.settings');
    const hueSlider = document.querySelector('#hue');
    const saturationSlider = document.querySelector('#saturation');
    const hueValue = document.querySelector('#hue-value');
    const saturationValue = document.querySelector('#saturation-value');
    let lightness = 55;

    function randomColor() {
      return {
        hue: Math.floor(Math.random() * 361),
        saturation: 58 + Math.floor(Math.random() * 24),
        lightness: 42 + Math.floor(Math.random() * 20)
      };
    }

    function applyColor(hue, saturation, nextLightness = lightness) {
      lightness = nextLightness;
      const color = `hsl(${hue} ${saturation}% ${lightness}%)`;
      page.style.backgroundColor = color;
      document.querySelector('meta[name="theme-color"]').content = color;
      settings.style.setProperty('--saturation-color', `hsl(${hue} 100% 50%)`);
      hueValue.value = `${hue}°`;
      saturationValue.value = `${saturation}%`;
    }

    function changeBackground(event) {
      if (event?.target.closest('.settings')) return;
      const color = randomColor();
      hueSlider.value = color.hue;
      saturationSlider.value = color.saturation;
      applyColor(color.hue, color.saturation, color.lightness);
      page.classList.add('clicked');
    }

    function updateFromControls() {
      page.classList.add('adjusting', 'clicked');
      applyColor(Number(hueSlider.value), Number(saturationSlider.value));
    }

    page.addEventListener('click', changeBackground);
    page.addEventListener('keydown', (event) => {
      if ((event.code === 'Space' || event.code === 'Enter') && !event.target.closest('.settings')) {
        event.preventDefault();
        changeBackground();
      }
    });

    hueSlider.addEventListener('input', updateFromControls);
    saturationSlider.addEventListener('input', updateFromControls);
    settings.addEventListener('change', () => page.classList.remove('adjusting'));

    applyColor(Number(hueSlider.value), Number(saturationSlider.value));

    page.tabIndex = 0;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
